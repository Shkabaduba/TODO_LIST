{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add</a>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td><a href="{% url 'todo:tag-update' tag.id %}">Update</a></td>
          <td><a href="{% url 'todo:tag-delete' tag.id %}">Delete</a></td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No tags yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
