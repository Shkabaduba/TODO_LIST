<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>
    {% block title %}
    Todo List
    {% endblock %}
  </title>
</head>
<body>
<div class="container-fluid mt-3">
  <div class="row">
      <div class="col-md-2">
        <ul class="list-group">
          <li class="list-group-item">
            <a href="{% url 'todo:task-list' %}">Home</a>
          </li>
          <li class="list-group-item">
            <a href="{% url "todo:tag-list" %}">Tags</a>
          </li>
        </ul>
      </div>

      <div class="col-md-10">
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>

</body>
</html>
